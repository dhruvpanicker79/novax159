<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · SecureMailScope</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8 4v6c0 5-3.4 9.3-8 10-4.6-.7-8-5-8-10V6l8-4z' fill='%2322d3ee'/%3E%3C/svg%3E">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="post" action="/login" autocomplete="on">
    <div class="login-brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <path d="M12 2l8 4v6c0 5-3.4 9.3-8 10-4.6-.7-8-5-8-10V6l8-4z"
              stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8.6 11.4h6.8v4.2H8.6zM10.2 11.4V9.6a1.8 1.8 0 013.6 0v1.8"
              stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <h1>SecureMailScope</h1>
    </div>
    <p class="login-sub">Passive cryptographic posture assessment for email infrastructure.</p>

    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}

    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autofocus required
             spellcheck="false" placeholder="analyst">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required
             placeholder="••••••••">
    </div>
    <button class="btn-primary" type="submit">Sign in</button>

    <div class="login-hint">
      demo &nbsp;analyst / analyst123 &nbsp;·&nbsp; triage<br>
      demo &nbsp;admin&nbsp;&nbsp; / admin123 &nbsp;&nbsp;·&nbsp; triage + sign-off
    </div>
  </form>
</div>
</body>
</html>
