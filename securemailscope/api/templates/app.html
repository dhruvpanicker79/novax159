<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureMailScope Console</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8 4v6c0 5-3.4 9.3-8 10-4.6-.7-8-5-8-10V6l8-4z' fill='%2322d3ee'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="rail-head">
      <svg class="mark" viewBox="0 0 24 24" fill="none">
        <path d="M12 2l8 4v6c0 5-3.4 9.3-8 10-4.6-.7-8-5-8-10V6l8-4z"
              stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8.6 11.4h6.8v4.2H8.6zM10.2 11.4V9.6a1.8 1.8 0 013.6 0v1.8"
              stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <b>SecureMailScope</b>
    </div>

    <div class="rail-status">
      <div class="lbl"><span class="pulse"></span> Passive · nothing decrypted</div>
      <div class="rail-metrics">
        <div><b id="m-sessions">—</b><span>sessions</span></div>
        <div><b id="m-findings">—</b><span>findings</span></div>
        <div><b id="m-grade">—</b><span>grade</span></div>
      </div>
    </div>

    <nav class="nav">
      <a href="#overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-5H3zM13 8h8V3h-8z"/></svg>Overview</a>
      <a href="#captures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-5 5l5-5 5 5M4 20h16"/></svg>Captures<span class="badge" id="b-captures"></span></a>

      <div class="nav-sep">Analysis</div>
      <a href="#sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h6v6H5zM13 15h6v6h-6zM8 9v6h8"/></svg>Sessions<span class="badge" id="b-sessions"></span></a>
      <a href="#findings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 20h20L12 2zm0 6v6m0 3v1"/></svg>Triage<span class="badge" id="b-findings"></span></a>
      <a href="#certificates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 118 0v4"/></svg>Certificates<span class="badge" id="b-certs"></span></a>
      <a href="#compliance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>Compliance</a>

      <div class="nav-sep">Governance</div>
      <a href="#audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6v20h12V6zM14 2v4h4M9 13h6M9 17h4"/></svg>Audit log</a>
      <a href="#snapshots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3zM3 3h18v4H3zm6 8h6"/></svg>Posture archive</a>
      <a href="#settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m-5-5l5 5 5-5M4 20h16"/></svg>Export</a>
    </nav>

    <div class="rail-foot">
      <a class="btn" href="/logout" style="width:100%;justify-content:center">Sign out</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn tiny hamburger" id="burger" aria-label="Menu">☰</button>
      <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
      <div class="chip good"><span class="pulse"></span>ENGINE OK</div>
      <div class="chip mono" id="clock">--:--</div>
      <div class="avatar" id="avatar">··</div>
      <div class="who"><b id="who-name">—</b><span id="who-role">—</span></div>
    </header>

    <main class="page" id="page"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast"></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
