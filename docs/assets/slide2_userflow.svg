<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 860" width="1840" height="860" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6B7B"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1B6E3C"/>
    </marker>
  </defs>

  <!-- ============ stage bands ============ -->
  <g font-size="15" font-weight="700" letter-spacing="1.1" fill="#7A8A99" text-anchor="middle">
    <rect x="150" y="18" width="330" height="34" rx="6" fill="#F1F4F7"/>
    <text x="315" y="41">INGEST</text>
    <rect x="495" y="18" width="330" height="34" rx="6" fill="#F1F4F7"/>
    <text x="660" y="41">RECONSTRUCT</text>
    <rect x="840" y="18" width="330" height="34" rx="6" fill="#F1F4F7"/>
    <text x="1005" y="41">INSPECT CRYPTO</text>
    <rect x="1185" y="18" width="330" height="34" rx="6" fill="#F1F4F7"/>
    <text x="1350" y="41">ANALYSE &amp; SCORE</text>
    <rect x="1530" y="18" width="292" height="34" rx="6" fill="#F1F4F7"/>
    <text x="1676" y="41">REPORT</text>
  </g>

  <!-- ============ lane labels ============ -->
  <g font-size="14" font-weight="700" letter-spacing="1.1" fill="#8896A4">
    <text x="18" y="112">ANALYST</text>
    <text x="18" y="292">SYSTEM</text>
    <text x="18" y="598">ENGINE</text>
    <text x="18" y="782">EVIDENCE</text>
  </g>
  <g stroke="#E3E8ED" stroke-width="1.5">
    <line x1="150" y1="170" x2="1822" y2="170"/>
    <line x1="150" y1="500" x2="1822" y2="500"/>
    <line x1="150" y1="700" x2="1822" y2="700"/>
  </g>

  <!-- ============ ANALYST lane ============ -->
  <g>
    <rect x="150" y="72" width="330" height="82" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="315" y="104" text-anchor="middle" font-size="19" font-weight="600" fill="#152532">Analyst supplies an</text>
    <text x="315" y="127" text-anchor="middle" font-size="19" font-weight="600" fill="#152532">authorised .pcap</text>
    <text x="315" y="147" text-anchor="middle" font-size="14" fill="#6A7986">file in — no live capture, no probing</text>

    <rect x="1185" y="72" width="330" height="82" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="1350" y="104" text-anchor="middle" font-size="19" font-weight="600" fill="#152532">Analyst reviews the</text>
    <text x="1350" y="127" text-anchor="middle" font-size="19" font-weight="600" fill="#152532">triage queue</text>
    <text x="1350" y="147" text-anchor="middle" font-size="14" fill="#6A7986">ranked by real impact, not alphabetically</text>

    <rect x="1530" y="72" width="292" height="82" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="1676" y="104" text-anchor="middle" font-size="19" font-weight="600" fill="#152532">Verifies any finding</text>
    <text x="1676" y="127" text-anchor="middle" font-size="19" font-weight="600" fill="#152532">in Wireshark</text>
    <text x="1676" y="147" text-anchor="middle" font-size="14" fill="#6A7986">by frame number and byte range</text>
  </g>

  <!-- ============ SYSTEM lane ============ -->
  <g>
    <rect x="150" y="200" width="155" height="92" rx="9" fill="#FFFFFF" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="227" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">Ingest</text>
    <text x="227" y="254" text-anchor="middle" font-size="14" fill="#4A5A69">SHA-256 of</text>
    <text x="227" y="272" text-anchor="middle" font-size="14" fill="#4A5A69">the capture</text>

    <rect x="325" y="200" width="155" height="92" rx="9" fill="#FFFFFF" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="402" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">Reassemble</text>
    <text x="402" y="254" text-anchor="middle" font-size="14" fill="#4A5A69">TCP streams +</text>
    <text x="402" y="272" text-anchor="middle" font-size="14" fill="#4A5A69">byte→frame map</text>

    <rect x="495" y="200" width="330" height="92" rx="9" fill="#FFFFFF" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="660" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">Identify protocol from the banner</text>
    <text x="660" y="256" text-anchor="middle" font-size="15" fill="#4A5A69">SMTP · IMAP · POP3 — never from the port</text>
    <text x="660" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#1B4E7A">then assign port role: relay / submission / access</text>

    <rect x="840" y="200" width="330" height="92" rx="9" fill="#FFFFFF" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="1005" y="232" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">Parse the TLS handshake</text>
    <text x="1005" y="256" text-anchor="middle" font-size="15" fill="#4A5A69">version · cipher · groups · JA3/JA3S</text>
    <text x="1005" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#1B6E3C">passive — nothing is decrypted</text>
  </g>

  <!-- decisions -->
  <g>
    <path d="M660 320 L790 372 L660 424 L530 372 z" fill="#FFF8E7" stroke="#B8860B" stroke-width="1.8"/>
    <text x="660" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#5C4405">STARTTLS</text>
    <text x="660" y="388" text-anchor="middle" font-size="16" font-weight="600" fill="#5C4405">completed?</text>

    <path d="M1005 320 L1135 372 L1005 424 L875 372 z" fill="#FFF8E7" stroke="#B8860B" stroke-width="1.8"/>
    <text x="1005" y="366" text-anchor="middle" font-size="16" font-weight="600" fill="#5C4405">Certificate</text>
    <text x="1005" y="388" text-anchor="middle" font-size="16" font-weight="600" fill="#5C4405">observable?</text>
  </g>

  <!-- branch outcomes -->
  <g>
    <rect x="150" y="330" width="330" height="84" rx="9" fill="#FDEDEC" stroke="#B3261E" stroke-width="2"/>
    <text x="315" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#7A1710">NO — attack evidence recorded</text>
    <text x="315" y="380" text-anchor="middle" font-size="14" fill="#7A1710">capability stripped · credentials in clear ·</text>
    <text x="315" y="400" text-anchor="middle" font-size="14" fill="#7A1710">downgrade sentinel — detected, never caused</text>

    <rect x="1185" y="330" width="330" height="84" rx="9" fill="#EDF4FB" stroke="#1B4E7A" stroke-width="2"/>
    <text x="1350" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#123A5C">NO — TLS 1.3 encrypts it</text>
    <text x="1350" y="380" text-anchor="middle" font-size="14" fill="#123A5C">reported as OPAQUE_TLS13 with the reason;</text>
    <text x="1350" y="400" text-anchor="middle" font-size="14" fill="#123A5C">host graded “?” — never a pass it did not earn</text>

    <rect x="840" y="440" width="330" height="48" rx="9" fill="#FFFFFF" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="1005" y="470" text-anchor="middle" font-size="16" fill="#152532">YES — validate chain, expiry, key, hostname</text>
  </g>

  <!-- ============ ENGINE lane ============ -->
  <g>
    <rect x="150" y="530" width="245" height="90" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="272" y="562" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">51-field feature</text>
    <text x="272" y="584" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">vector per session</text>

    <rect x="415" y="530" width="245" height="90" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="537" y="562" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">34 rules, each</text>
    <text x="537" y="584" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">citing its clause</text>
    <text x="537" y="606" text-anchor="middle" font-size="14" fill="#4A5A69">deterministic — no probability</text>

    <rect x="680" y="530" width="285" height="90" rx="9" fill="#FFF4EC" stroke="#C2410C" stroke-width="2.2"/>
    <text x="822" y="562" text-anchor="middle" font-size="17" font-weight="700" fill="#7C2D12">Role-aware severity</text>
    <text x="822" y="584" text-anchor="middle" font-size="14" fill="#7C2D12">same flaw, INFO on port 25,</text>
    <text x="822" y="604" text-anchor="middle" font-size="14" fill="#7C2D12">CRITICAL where a password crosses</text>

    <rect x="985" y="530" width="245" height="90" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="1107" y="562" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">ML risk, anomaly</text>
    <text x="1107" y="584" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">and priority</text>
    <text x="1107" y="606" text-anchor="middle" font-size="14" fill="#4A5A69">ranking only, never facts</text>

    <rect x="1250" y="530" width="245" height="90" rx="9" fill="#EEF2F6" stroke="#9AAAB8" stroke-width="1.5"/>
    <text x="1372" y="562" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">Grade each host</text>
    <text x="1372" y="584" text-anchor="middle" font-size="17" font-weight="600" fill="#152532">and the fleet</text>
    <text x="1372" y="606" text-anchor="middle" font-size="14" fill="#4A5A69">A+ to F, or “?”</text>

    <rect x="1530" y="530" width="292" height="90" rx="9" fill="#FFF4EC" stroke="#C2410C" stroke-width="2.2"/>
    <text x="1676" y="562" text-anchor="middle" font-size="17" font-weight="700" fill="#7C2D12">report.json +</text>
    <text x="1676" y="584" text-anchor="middle" font-size="17" font-weight="700" fill="#7C2D12">self-contained .html</text>
    <text x="1676" y="606" text-anchor="middle" font-size="14" fill="#7C2D12">one file · opens offline · SIEM-ingestible</text>
  </g>

  <!-- ============ EVIDENCE strip ============ -->
  <rect x="150" y="726" width="1672" height="72" rx="9" fill="#F4F6F8" stroke="#D3DBE2" stroke-width="1.5"/>
  <text x="986" y="755" text-anchor="middle" font-size="18" font-weight="700" fill="#152532">Every finding carries: capture SHA-256 · stream id · frame numbers · byte range · direction · timestamp</text>
  <text x="986" y="782" text-anchor="middle" font-size="16" fill="#4A5A69">Open the capture in Wireshark and disprove any claim — the form section 63 BSA 2023 expects of digital evidence</text>

  <!-- ============ arrows ============ -->
  <g stroke="#5A6B7B" stroke-width="2.4" fill="none" marker-end="url(#a)">
    <path d="M308 246 L320 246"/>
    <path d="M483 246 L490 246"/>
    <path d="M660 295 L660 316"/>
    <path d="M790 372 L830 372 L830 246 L836 246"/>
    <path d="M1005 295 L1005 316"/>
    <path d="M1005 426 L1005 436"/>
    <path d="M1005 490 L1005 512 L272 512 L272 526"/>
    <path d="M398 575 L411 575"/>
    <path d="M663 575 L676 575"/>
    <path d="M968 575 L981 575"/>
    <path d="M1233 575 L1246 575"/>
    <path d="M1498 575 L1526 575"/>
    <path d="M315 158 L315 196"/>
    <path d="M1676 526 L1676 400 L1676 160"/>
    <path d="M1515 113 L1526 113"/>
  </g>
  <g stroke="#B3261E" stroke-width="2.4" fill="none" marker-end="url(#ar)">
    <path d="M530 372 L484 372"/>
    <path d="M315 418 L315 500 L272 500 L272 526"/>
  </g>
  <g stroke="#1B4E7A" stroke-width="2.4" fill="none" marker-end="url(#a)">
    <path d="M1135 372 L1181 372"/>
    <path d="M1350 418 L1350 512 L1372 512 L1372 526"/>
  </g>
  <g font-size="14" font-weight="700">
    <text x="500" y="364" fill="#B3261E">NO</text>
    <text x="1148" y="364" fill="#1B4E7A">NO</text>
    <text x="800" y="362" fill="#1B6E3C">YES</text>
    <text x="1014" y="436" fill="#1B6E3C">YES</text>
  </g>

  <!-- ============ module citations ============ -->
  <g font-family="Consolas, Courier New, monospace" font-size="13" fill="#8896A4">
    <text x="227" y="308" text-anchor="middle">capture/ingest.py</text>
    <text x="402" y="308" text-anchor="middle">capture/reassemble.py</text>
    <text x="660" y="308" text-anchor="middle">proto/detect.py + roles.py</text>
    <text x="1005" y="308" text-anchor="middle">tls/handshake.py</text>
    <text x="1005" y="504" text-anchor="middle">certs/chain.py</text>
    <text x="272" y="646" text-anchor="middle">features/</text>
    <text x="537" y="636" text-anchor="middle">rules/pack.py</text>
    <text x="822" y="636" text-anchor="middle">rules/severity.py</text>
    <text x="1107" y="636" text-anchor="middle">ml/</text>
    <text x="1676" y="636" text-anchor="middle">report/assets.py</text>
  </g>
</svg>
